{% extends "base.html" %}{% block body %}<h1>{{ 'Sửa' if p else 'Thêm' }} sản phẩm</h1>{% include "admin_nav.html" %}
<form method="post" enctype="multipart/form-data" class="card" id="f">
<label>Tên</label><input name="name" required value="{{ p.name if p }}">
<label>SKU / mã hàng</label><input name="sku" value="{{ p.sku if p }}">
<label>Giá nhập (¥ Tệ)</label><input name="cny" id="cny" type="number" step="0.01" required value="{{ p.cny if p }}">
<label>Khối lượng 1 sản phẩm (kg)</label><input name="weight" id="weight" type="number" step="0.01" min="0" value="{{ p.weight if p else 0 }}">
<label>Tiền cân cộng thêm / mỗi sản phẩm (đ)</label><input name="surcharge" id="sur" type="number" min="0" value="{{ p.surcharge if p else default_sur }}">
<small>Mặc định {{ default_sur|vnd }}. Nếu nặng hơn {{ '%g'|format(heavy) }}kg, web sẽ hỏi bạn mức cộng riêng.</small>
<p>Giá bán dự kiến: <b id="pv">–</b></p>
<label>Loại hàng</label><select name="type"><option value="instock" {{ 'selected' if p and p.type=='instock' }}>Có sẵn</option><option value="preorder" {{ 'selected' if p and p.type=='preorder' }}>Pre-order</option></select>
<label>Số lượng trong kho</label><input name="stock" type="number" min="0" value="{{ p.stock if p else 0 }}">
<label>Link Taobao / 1688</label><input name="link" value="{{ p.link if p }}">
<label>Mô tả</label><textarea name="description" rows="3">{{ p.description if p }}</textarea>
<label>Ảnh</label><input type="file" name="image" accept="image/*">
<label><input type="checkbox" name="active" style="width:auto" {{ 'checked' if (not p) or p.active }}> Hiển thị</label>
<p><button class="btn">Lưu</button></p></form>
{% if p %}<form method="post" action="{{ url_for('admin_product_delete', pid=p.id) }}" onsubmit="return confirm('Ẩn sản phẩm này?')"><button class="btn alt small">Ẩn sản phẩm</button></form>{% endif %}
<script>
const rate={{ rate }}, markup={{ markup }}, heavy={{ heavy }}, defSur={{ default_sur }};
const $=id=>document.getElementById(id);
function preview(){const c=parseFloat($('cny').value)||0, s=parseInt($('sur').value)||0;
 $('pv').textContent=(Math.round(c*rate*markup/100)+s).toLocaleString('vi-VN')+'đ';}
$('weight').addEventListener('change',()=>{
 const w=parseFloat($('weight').value)||0;
 if(w>heavy){
  const v=prompt('Sản phẩm nặng '+w+'kg (> '+heavy+'kg).\nTiền cân cộng thêm cho MỖI sản phẩm là bao nhiêu đ? (thay cho '+defSur.toLocaleString('vi-VN')+'đ)',$('sur').value);
  if(v!==null && v.trim()!=='' && !isNaN(v)) $('sur').value=parseInt(v);
 } else if(!{{ 'true' if p else 'false' }}) { $('sur').value=defSur; }
 preview();});
['cny','sur'].forEach(i=>$(i).addEventListener('input',preview)); preview();
</script>{% endblock %}
